<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employee PDF System</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f5f5f5;
}

.header{
    background:#0078d4;
    color:white;
    padding:15px;
}

.container{
    padding:20px;
}

.search{
    width:100%;
    padding:10px;
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#0078d4;
    color:white;
}

button{
    background:#28a745;
    color:white;
    border:none;
    padding:8px 15px;
    cursor:pointer;
    border-radius:4px;
}

button:hover{
    background:#1d7d31;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
}

.modal-content{
    background:white;
    width:90%;
    max-width:1200px;
    margin:20px auto;
    padding:20px;
    border-radius:10px;
    max-height:90vh;
    overflow:auto;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.grid input{
    width:100%;
    padding:8px;
}

.section{
    border:1px solid #ddd;
    padding:10px;
    margin-bottom:15px;
}
</style>
</head>

<body>

<div class="header">
<h2>Employee PDF System</h2>
</div>

<div class="container">

<input
class="search"
type="text"
id="searchBox"
placeholder="Search Employee"
onkeyup="searchEmployee()">

<div id="employeeTable">
Loading...
</div>

</div>

<div class="modal" id="employeeModal">
<div class="modal-content">

<h2>Employee Details</h2>

<div id="employeeForm"></div>

<br>

<button onclick="downloadPDF()">
Download PDF
</button>

<button onclick="closeModal()">
Close
</button>

</div>
</div>

<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8i1kx0NCALI0s9C82TJrGWR_y0q_9czN28swKUuPI0UE8czyH9VTHSA8tfTQKRfIsvmbWW-06eh_p/pub?gid=0&single=true&output=csv";

let employees=[];
let currentEmployee=null;

loadEmployees();

function loadEmployees(){

Papa.parse(CSV_URL,{
download:true,
header:true,
skipEmptyLines:true,

complete:function(result){

employees=result.data;

renderTable();

}
});

}

function renderTable(){

let html=`
<table id="empTable">

<thead>
<tr>
<th>Name</th>
<th>Branch</th>
<th>Designation</th>
<th>Action</th>
</tr>
</thead>

<tbody>
`;

employees.forEach((row,index)=>{

html+=`
<tr>

<td>
${row["First Name"]||""}
${row["Middle Name"]||""}
${row["Last Name"]||""}
</td>

<td>${row["Branch"]||""}</td>

<td>${row["Designation"]||""}</td>

<td>
<button onclick="openEmployee(${index})">
View
</button>
</td>

</tr>
`;

});

html+=`
</tbody>
</table>
`;

document.getElementById("employeeTable").innerHTML=html;

}

function searchEmployee(){

const value=
document.getElementById("searchBox")
.value
.toLowerCase();

const rows=
document.querySelectorAll("#empTable tbody tr");

rows.forEach(row=>{

row.style.display=
row.innerText.toLowerCase().includes(value)
? ""
: "none";

});

}

function openEmployee(index){

currentEmployee=
JSON.parse(
JSON.stringify(
employees[index]
)
);

let html="";

for(const key in currentEmployee){

html+=`
<div class="section">

<label>
<b>${key}</b>
</label>

<input
id="${key}"
value="${currentEmployee[key]||''}">

</div>
`;

}

document.getElementById("employeeForm")
.innerHTML=html;

document.getElementById("employeeModal")
.style.display="block";

}

function closeModal(){

document.getElementById("employeeModal")
.style.display="none";

}

async function downloadPDF(){

const { jsPDF }=window.jspdf;

const pdf=new jsPDF();

let y=15;

pdf.setFontSize(18);

pdf.text(
"EMPLOYEE APPLICATION",
10,
y
);

y+=15;

const inputs=
document.querySelectorAll(
"#employeeForm input"
);

inputs.forEach(input=>{

pdf.setFontSize(10);

const text=
`${input.id}: ${input.value}`;

if(y>280){

pdf.addPage();

y=20;

}

pdf.text(
text,
10,
y
);

y+=6;

});

const firstName=
document.getElementById("First Name")
? document.getElementById("First Name").value
: "Employee";

const lastName=
document.getElementById("Last Name")
? document.getElementById("Last Name").value
: "";

pdf.save(
`${firstName}_${lastName}.pdf`
);

}

</script>

</body>
</html>
