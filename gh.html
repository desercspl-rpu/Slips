<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sheet Test</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
body{
    font-family:Arial;
    padding:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
}

th{
    background:#0078d4;
    color:#fff;
}
</style>

</head>
<body>

<h2>Employee List</h2>

<div id="output">Loading...</div>

<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vS1PpUAIHpcAxYU0Eq-tXBcz4jxExiO17dyMWNIU1HBFlfCjpSBdDDMnGnVnBi3296QyZKHG1shxtNE/pub?gid=0&single=true&output=csv ";

Papa.parse(CSV_URL,{
    download:true,
    header:true,
    skipEmptyLines:true,

    complete:function(results){

        console.log(results.data);

        let html = "<table>";

        html += `
        <tr>
            <th>Name</th>
            <th>Branch</th>
            <th>Action</th>
        </tr>
        `;

        results.data.forEach((row,index)=>{

            html += `
            <tr>
                <td>
                    ${row["First Name"] || ""}
                    ${row["Middle Name"] || ""}
                    ${row["Last Name"] || ""}
                </td>

                <td>${row["Branch"] || ""}</td>

                <td>
                    <button onclick="alert('Row : ${index}')">
                        Generate PDF
                    </button>
                </td>
            </tr>
            `;

        });

        html += "</table>";

        document.getElementById("output").innerHTML = html;

    },

    error:function(err){

        document.getElementById("output").innerHTML =
        err.message;

        console.error(err);

    }

});

</script>

</body>
</html>
